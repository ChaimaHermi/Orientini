<div class="messages-container">

  <!-- ===== MESSAGE LOOP ===== -->
  <div
    *ngFor="let message of messages"
    class="message"
    [class.user]="message.isUser"
  >

    <!-- ===== AVATAR ===== -->
    <div class="avatar">
      <ng-container *ngIf="message.isUser; else botAvatar">
        <!-- USER ICON -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path
            d="M20 21V19C20 17.9391 19.5786 16.9217 18.8284 16.1716C18.0783 15.4214 17.0609 15 16 15H8C6.93913 15 5.92172 15.4214 5.17157 16.1716C4.42143 16.9217 4 17.9391 4 19V21"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M12 11C14.2091 11 16 9.20914 16 7C16 4.79086 14.2091 3 12 3C9.79086 3 8 4.79086 8 7C8 9.20914 9.79086 11 12 11Z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </ng-container>

      <!-- BOT ICON -->
      <ng-template #botAvatar>
        <div class="bot-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path
              d="M12 8V12L15 15M18 11C18 14.866 14.866 18 11 18C7.13401 18 4 14.866 4 11C4 7.13401 7.13401 4 11 4C14.866 4 18 7.13401 18 11Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </ng-template>
    </div>

    <!-- ===== CONTENT ===== -->
    <div class="content">

      <!-- TEXTE -->
      <div
        class="text"
        [innerHTML]="renderMessage(message.content, message.isUser)"
      ></div>

<!-- ===== IMAGES (MuRAG) ===== -->
<div class="files" *ngIf="message.images && !message.isUser">
  <div *ngFor="let key of objectKeys(message.images)">
    <div class="file-grid">
      <div class="image-card" *ngFor="let img of message.images[key]">
        
        <img
          [src]="backendUrl + img"
          class="file-preview"
          alt="Image institution"
          loading="lazy"
          (click)="openImage(img)"
        />

        <button
          class="download-btn"
          (click)="downloadImage(img)">
          ⬇️
        </button>

      </div>
    </div>
  </div>
</div>

<!-- ===== LIGHTBOX ===== -->
<div class="lightbox" *ngIf="selectedImage" (click)="closeImage()">
  <img [src]="selectedImage" />
</div>


      <!-- META -->
      <div class="meta">
        <div class="timestamp">
          {{ message.timestamp | date:'shortTime' }}
        </div>
      </div>

    </div>
  </div>

  <!-- ===== LOADING MESSAGE ===== -->
  <div class="message loading-message" *ngIf="isLoading">
    <div class="avatar">
      <div class="bot-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path
            d="M12 8V12L15 15M18 11C18 14.866 14.866 18 11 18C7.13401 18 4 14.866 4 11C4 7.13401 7.13401 4 11 4C14.866 4 18 7.13401 18 11Z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </div>

    <div class="content">
      <div class="text loading-text">
        <span class="typing-indicator">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </span>
        <span>Orientini réfléchit…</span>
      </div>
    </div>
  </div>

</div>
